<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* STRYT feature graphic — 1024x500. Brand: "Street Light" (index.css :root):
     purple night sky, amber lamp, pink beam, Outfit for text. */
  :root {
    --brand-400: #a575fb; --brand-500: #8b47f5; --brand-700: #6b21cc;
    --brand-800: #5b21b6; --brand-900: #4c1d95;
    --accent-400: #ffba2b; --accent-500: #ff9500;
    --pink-400: #ff79c2; --pink-500: #ff5dba;
    --ink-900: #1a1530;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: Outfit, system-ui, sans-serif;
    background:
      radial-gradient(120% 90% at 22% 8%, rgba(255,186,43,.22) 0%, rgba(255,93,186,.10) 34%, rgba(0,0,0,0) 62%),
      linear-gradient(160deg, #2a1259 0%, var(--brand-900) 34%, var(--brand-800) 62%, #3d1a86 100%);
    position: relative;
  }
  /* faint street grid, like the map behind the app's headers */
  .glowR { position: absolute; right: -80px; top: -60px; width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,93,186,.20) 0%, rgba(255,93,186,0) 70%); }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(90% 80% at 50% 40%, #000 30%, transparent 78%);
  }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: 4px; padding: 0 60px 26px; }
  .lockup { display: flex; align-items: center; gap: 30px; }
  .word { color: #fff; }
  .word h1 {
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    font-size: 116px; line-height: .86; letter-spacing: -2px; font-weight: 900;
  }
  .word p {
    margin-top: 14px; font-size: 25px; font-weight: 700; letter-spacing: .06em;
    color: #fff; opacity: .93;
  }
  .word small {
    display: block; margin-top: 10px; font-size: 19px; font-weight: 500;
    letter-spacing: .01em; color: #e9dcff; opacity: .86;
  }
  /* skyline of shuttered shops with lit windows, same language as the in-app header */
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 132px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glowR"></div>

  <div class="wrap">
    <!-- lamp: the exact geometry from src/components/BrandLockup.tsx -->
    <svg width="250" height="330" viewBox="0 -34 130 190" style="overflow: visible; flex: 0 0 auto;">
      <defs>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent-400)" stop-opacity=".62" />
          <stop offset="52%" stop-color="var(--accent-500)" stop-opacity=".26" />
          <stop offset="100%" stop-color="var(--pink-500)" stop-opacity="0" />
        </linearGradient>
        <filter id="spill" x="-60%" y="-40%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="10" />
        </filter>
        <radialGradient id="halo">
          <stop offset="0%" stop-color="#fff3d0" stop-opacity=".95" />
          <stop offset="45%" stop-color="var(--accent-400)" stop-opacity=".55" />
          <stop offset="100%" stop-color="var(--accent-500)" stop-opacity="0" />
        </radialGradient>
      </defs>
      <!-- beam falling to the street -->
      <polygon points="44,8 88,8 128,156 4,156" fill="var(--accent-400)" opacity=".16" filter="url(#spill)" />
      <polygon points="50,8 82,8 116,156 16,156" fill="url(#beam)" />
      <!-- lamp -->
      <polygon points="14,156 34,156 28,60 20,60" fill="var(--ink-900)" />
      <path d="M24 60 L24 -8 C24 -26 66 -26 66 -12" fill="none" stroke="var(--ink-900)" stroke-width="4.2" stroke-linecap="round" />
      <circle cx="66" cy="11" r="30" fill="url(#halo)" />
      <path d="M56 -6 L76 -6 L82 8 L50 8 Z" fill="var(--ink-900)" />
      <path d="M59 -12 L73 -12 L76 -6 L56 -6 Z" fill="var(--ink-900)" />
      <rect x="54" y="6.5" width="24" height="4.4" rx="2.2" fill="#fff3d0" />
    </svg>

    <div class="word">
      <h1>STRYT</h1>
      <p>YOUR STREET. YOUR PEOPLE.</p>
      <small>Shops, services and neighbours — a few minutes from your door</small>
    </div>
  </div>

  <svg class="skyline" viewBox="0 0 1024 132" preserveAspectRatio="none">
    <g fill="#241046" opacity=".92">
      <rect x="0" y="52" width="96" height="80" />
      <rect x="104" y="30" width="78" height="102" />
      <rect x="190" y="66" width="120" height="66" />
      <rect x="318" y="20" width="86" height="112" />
      <rect x="412" y="58" width="104" height="74" />
      <rect x="524" y="36" width="92" height="96" />
      <rect x="624" y="64" width="126" height="68" />
      <rect x="758" y="26" width="84" height="106" />
      <rect x="850" y="56" width="174" height="76" />
    </g>
    <g fill="#ffba2b" opacity=".78">
      <rect x="26" y="70" width="9" height="9" rx="1.5" /><rect x="56" y="88" width="9" height="9" rx="1.5" />
      <rect x="126" y="52" width="9" height="9" rx="1.5" /><rect x="152" y="76" width="9" height="9" rx="1.5" />
      <rect x="214" y="86" width="9" height="9" rx="1.5" /><rect x="262" y="86" width="9" height="9" rx="1.5" />
      <rect x="340" y="44" width="9" height="9" rx="1.5" /><rect x="372" y="70" width="9" height="9" rx="1.5" />
      <rect x="440" y="78" width="9" height="9" rx="1.5" /><rect x="482" y="96" width="9" height="9" rx="1.5" />
      <rect x="548" y="58" width="9" height="9" rx="1.5" /><rect x="586" y="82" width="9" height="9" rx="1.5" />
      <rect x="652" y="84" width="9" height="9" rx="1.5" /><rect x="706" y="98" width="9" height="9" rx="1.5" />
      <rect x="782" y="48" width="9" height="9" rx="1.5" /><rect x="812" y="74" width="9" height="9" rx="1.5" />
      <rect x="878" y="76" width="9" height="9" rx="1.5" /><rect x="944" y="92" width="9" height="9" rx="1.5" />
    </g>
  </svg>
</body>
</html>
