# Database Guardrails CI
#
# W8 — Automated enforcement of the rules in docs/database/HANDOFF.md.
#
# Triggered:
#   1. On PRs that touch supabase/** — runs the migration linter (lint:migrations).
#   2. Nightly at 02:00 UTC — runs the drift checker (check-drift) against
#      the live Supabase project via direct connection using the least-privilege
#      ci_readonly role.
#
#   3. Nightly — also checks pg_cron job health (a job that failed recently, or
#      stopped running altogether).
#
# The drift check needs DRIFT_DATABASE_URL as a GitHub repository secret.
# The cron check accepts either that or SUPABASE_PERSONAL_ACCESS_TOKEN +
# SUPABASE_PROJECT_REF. Note that a least-privilege role is NOT enough for the
# cron check: cron.job and cron.job_run_details have RLS, and pg_cron restricts
# rows to the job owner, so such a role sees zero rows — which looks identical to
# a healthy database with no jobs. See the note at the top of
# scripts/check-cron-health.mjs.
#
# Until provisioned, both jobs exit cleanly (the scripts skip gracefully when
# credentials are absent).

name: Database Guardrails

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/lint-migrations.mjs'
      - 'scripts/check-migration-drift.mjs'

  schedule:
    # Nightly drift check at 02:00 UTC
    - cron: '0 2 * * *'

  workflow_dispatch: {}

concurrency:
  group: db-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Migration Linter ─────────────────────────────────────────────
  lint-migrations:
    name: Lint Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migration linter (all migrations)
        run: node scripts/lint-migrations.mjs --all

      - name: Run migration lint tests
        run: npx vitest run tests/lint-migrations.test.ts

  # ── Job 2: Drift Checker (nightly + manual) ─────────────────────────────
  check-drift:
    name: Check Schema Drift
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run drift check against live database
        env:
          DATABASE_URL: ${{ secrets.DRIFT_DATABASE_URL }}
        run: node scripts/check-migration-drift.mjs

      # Fails when a pg_cron job has failed in the last 24h, or has stopped running within twice its own
      # schedule. Nothing else watches these: if close-expired-business-sessions stops, a revoked team-access
      # session keeps working, because expiring it is that job's whole purpose.
      #
      # `if: always()` so a drift failure above does not hide a cron failure here — they are independent
      # problems and the nightly run should report both.
      - name: Check cron job health
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DRIFT_DATABASE_URL }}
          SUPABASE_PERSONAL_ACCESS_TOKEN: ${{ secrets.SUPABASE_PERSONAL_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-cron-health.mjs
