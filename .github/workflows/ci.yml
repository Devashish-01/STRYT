name: CI Release Gate

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_call:

# One group per calling workflow. The OTA and Android release workflows both call this gate on the same push to
# main; with a group of just the ref, the second to start cancelled the first — the first release after this gate
# was added (1.0.64, 18 Sept 2026) lost its Android build that way. In a reusable workflow `github.workflow` is the
# caller's name, so each release keeps its own gate while repeated pushes to one PR still cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (type-check, lint, tests, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run lint and unit tests (no .env)
        # Tests must run before any .env is created so vitest falls back
        # to the attestations in vitest.config.ts (e.g. WEB_PUSH_VAPID_CONFIGURED).
        run: npm run verify:ci:test

      - name: Write placeholder .env for build
        run: |
          cat > .env << 'EOF'
          VITE_USE_MOCKS=false
          VITE_SUPABASE_URL=https://dummy.supabase.co
          VITE_SUPABASE_ANON_KEY=dummy-anon-key
          VITE_FIREBASE_API_KEY=dummy-firebase-key
          VITE_FIREBASE_AUTH_DOMAIN=zetax-52843.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=zetax-52843
          VITE_FIREBASE_STORAGE_BUCKET=zetax-52843.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=44008185482
          VITE_FIREBASE_APP_ID=dummy-app-id
          VITE_MAPBOX_TOKEN=dummy-mapbox-token
          VITE_API_URL=https://stryt.in
          VITE_APP_URL=https://stryt.in
          VITE_VAPID_PUBLIC_KEY=dummy-vapid-public-key
          VITE_BUG_REPORT_EXCEL_URL=https://dummy.url
          VITE_BUG_REPORT_SCRIPT_URL=https://dummy.url
          EOF

      - name: Run Vite production build
        run: npm run build
