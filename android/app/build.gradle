apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Version is injectable from CI so each Play upload gets a monotonically
// increasing versionCode (Play rejects re-used codes). Pass
//   -PstrytVersionCode=<int> -PstrytVersionName=<semver>
// e.g. from the GitHub Actions run number + package.json version. Falls back
// to package.json version for local builds.
def packageJsonFile = new File(rootProject.projectDir, '../package.json')
def pkgJson = packageJsonFile.exists() ? new JsonSlurper().parseText(packageJsonFile.text) : null
def defaultVersionName = (pkgJson?.version ?: '1.0.61').toString()

def defaultVersionCode = 61
if (defaultVersionName) {
    try {
        def parts = defaultVersionName.split('\\.')
        if (parts.length >= 3) {
            defaultVersionCode = parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()
        }
    } catch (Exception ignored) {}
}

def strytVersionCode = (project.findProperty('strytVersionCode') ?: defaultVersionCode).toString().toInteger()
def strytVersionName = (project.findProperty('strytVersionName') ?: defaultVersionName).toString()

android {
    namespace = "in.stryt.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.stryt.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode strytVersionCode
        versionName strytVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // CI passes -Pandroid.injected.signing.* ; local release builds need
            // RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD env vars (never commit secrets).
            def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: findProperty("RELEASE_STORE_PASSWORD") ?: ""
            def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD") ?: findProperty("RELEASE_KEY_PASSWORD") ?: ""
            storeFile file('stryt-release.keystore')
            storePassword releaseStorePassword
            keyAlias 'stryt-key'
            keyPassword releaseKeyPassword
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
