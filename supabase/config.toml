# STRYT Supabase project config.
#
# Purpose of this file (Security Audit H-2): each Edge Function's JWT-gateway
# check was previously a dashboard-only toggle — invisible to code review and
# indistinguishable from drift. Declaring verify_jwt here makes the intended
# posture explicit and version-controlled; `supabase functions deploy` reads
# it, and the dashboard becomes the *output* of this file, not the source of
# truth.
#
# Every function is auth-gated (verify_jwt = true) EXCEPT two:
#   - app-update, the public self-hosted OTA check the app polls on every
#     foreground before a session may exist.
#   - send-push, which is called by the push_on_notification_insert DB trigger
#     using the project's SECRET API key. Secret keys are not JWTs, so the
#     gateway cannot vet one — it must travel on the `apikey` header and
#     verify_jwt must be false. send-push's own in-handler check is therefore
#     the only authorization boundary; see the long comment in its index.ts
#     before weakening it.
#
# Note: admin-profile-management/ and sync-bug-report/ are empty directories
# in this repo (no index.ts) — nothing to declare until they have real code.

project_id = "gnswxlfmcwyhmzlfipql"

[functions.admin-delete-profile]
verify_jwt = true

[functions.ai-assist]
verify_jwt = true

[functions.app-update]
verify_jwt = false

[functions.profile-control]
verify_jwt = true

[functions.purge-deleted-accounts]
# The daily cron calls this with the project's SECRET API key, not a JWT — see
# the note above send-push. verify_jwt must be false so the gateway doesn't
# reject the secret key before the function runs; the function's own check
# (compare against secretKey() directly, no JWT decoding) is the boundary for
# that call. The self-serve user-deletion path is unaffected: it re-verifies
# the caller's session token itself via sb.auth.getUser(), independent of this
# gateway setting.
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.send-support-email]
verify_jwt = true

[functions.verification-review]
verify_jwt = true
