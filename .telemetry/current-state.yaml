# Current State: reverse-engineered from codebase
# Scanned: 2026-10-27
# SDK: custom first-party wrapper (src/lib/analytics.ts) writing to the Supabase table public.events
#      via supabase-js. Also present: @vercel/analytics + @vercel/speed-insights (page views / perf),
#      Sentry + client_errors (errors, out of product-analytics scope).
# Event-name whitelist: CHECK constraint events_name_known, last redefined in
#      supabase/migrations/20261003_delivery_operations.sql:1296

