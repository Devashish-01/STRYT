# Automatic envelope on every events row (set by wrapper or column defaults, not by callers)
envelope:
  client_sent: [name, props, session_id, app_version]
  server_defaulted: [id, user_id, created_at]
  notes: "user_id = auth.uid() column default, pinned by RLS. null for guests. id prefixed ev_."

# Non-event telemetry that also records product behavior (database-side counters / logs)
database_counters:
  - name: "bump_business_metric"
    location: "src/services/marketplace/businessService.ts:1006, :1015"
    effect: "view → businesses.view_count + business_view_logs row. call/directions → businesses.call_count / directions_count"
  - name: "bump_provider_views"
    location: "src/services/marketplace/providerService.ts:254"
    effect: "providers.view_count + provider_view_logs row"
  - name: "marketplace_health(p_days)"
    location: "supabase/migrations/20260996_product_analytics.sql:97"
    effect: "Admin-only RPC computing requests, answer_rate, median minutes to first proposal, agreements, deals_completed, disputes, active_sellers from source tables"
    call_sites: "None in src/ (only the generated type in src/types/database.types.ts)"

identity:
  identify_calls: "No identify() equivalent. Identity comes from the Supabase JWT on insert (user_id column default). No user traits are sent to the events sink."
  group_calls: "No group() calls found. No business_id or provider_id is attached to events."
  page_calls:
    - location: "src/main.tsx:54"
      details: "<Analytics /> from @vercel/analytics/react, automatic page views to Vercel"
  anonymous_id:
    - location: "src/lib/analytics.ts:66"
      details: "session_id s_<uuid> in sessionStorage key stryt_analytics_session. Per tab session, not persisted."
  reset_calls: "No reset on logout. session_id and the per-session counter are not cleared when the user signs out."

patterns:
  naming_style: snake_case
  naming_format: "object_action, past tense (request_created, delivery_picked_up)"
  centralized: true
  error_handling: "try/catch in track() and send(). Fire-and-forget (void promise). Failures dropped silently."
  rate_limit: "MAX_PER_SESSION = 500 events per JS module lifetime"
  pii_handling: "props pass through scrubValue (src/lib/scrubPii.ts). DB caps props at 2 KB."
  type_safety: "EventName union type mirrors the DB CHECK whitelist. Props typed as flat Record<string, primitive>."
  call_location: "Mostly in service layer after a successful RPC/insert. 3 calls in screens (UserOnboard, RequestDetail, TrackingPage)."
